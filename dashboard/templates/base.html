<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LLM Web Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/alpine.min.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="brand">🤖 LLM Web Agent</a>
        <div class="nav-links">
            <a href="/dashboard">Overview</a>
            <a href="/dashboard/workflows">Workflows</a>
            <a href="/dashboard/runs">Runs</a>
            <a href="http://localhost:6080/vnc.html?autoconnect=true&resize=scale"
               target="_blank" rel="noopener">👁️ Live Chrome</a>
            <a href="/docs" target="_blank">API</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <span>LLM Web Agent — MIT License</span>
        <span>Built with HTMX + FastAPI</span>
    </footer>
</body>
</html>
